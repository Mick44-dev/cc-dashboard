<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Hangar — Tableau de bord</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #252836;
  --border: #2e3244;
  --text: #e4e6f0;
  --text2: #8b8fa3;
  --green: #22c55e;
  --green-bg: rgba(34,197,94,0.12);
  --orange: #f59e0b;
  --orange-bg: rgba(245,158,11,0.12);
  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.12);
  --blue: #3b82f6;
  --blue-bg: rgba(59,130,246,0.12);
  --purple: #a855f7;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface2: #f0f1f5;
    --border: #e2e4ea;
    --text: #1a1d27;
    --text2: #6b6f82;
  }
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: clamp(12px, 2vw, 24px);
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: clamp(14px, 2.5vw, 20px);
  flex-wrap: wrap;
  gap: 8px;
}
.header h1 { font-size: clamp(1.15rem, 1rem + 1.2vw, 1.5rem); font-weight: 700; }
.header-right { display: flex; align-items: center; gap: 12px; }
.refresh-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
}
.refresh-btn:hover { background: var(--border); }
.last-update { font-size: 0.75rem; color: var(--text2); }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 2vw, 16px); margin-bottom: 16px; }
@media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: clamp(16px, 2vw, 24px);
  min-width: 0;
}
.card-title {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text2);
  margin-bottom: clamp(12px, 2vw, 16px);
}

.chapelle-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.chapelle-label {
  font-size: 0.8rem;
  color: var(--text2);
  min-width: 75px;
}
.progress-bar {
  flex: 1;
  height: 10px;
  background: var(--surface2);
  border-radius: 5px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 5px;
  transition: width 0.6s ease;
}
.progress-fill.green { background: var(--green); }
.progress-fill.orange { background: var(--orange); }
.chapelle-count {
  font-size: 0.8rem;
  font-weight: 600;
  min-width: 35px;
  text-align: right;
}
.demi-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 6px 24px;
}
.demi-label {
  font-size: 0.75rem;
  color: var(--text2);
  min-width: 30px;
}
.demi-count {
  font-size: 0.75rem;
  color: var(--text2);
  min-width: 35px;
  text-align: right;
}
.total-row {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.total-row .chapelle-label { font-weight: 700; color: var(--text); }

.revenue-main {
  font-size: clamp(1.5rem, 1.2rem + 1.8vw, 2rem);
  font-weight: 700;
  margin-bottom: 4px;
}
.revenue-sub { font-size: 0.85rem; color: var(--text2); margin-bottom: 12px; }
.fill-indicator {
  margin: 12px 0;
  padding: 10px 14px;
  background: var(--surface2);
  border-radius: 8px;
}
.fill-bar-lg {
  height: 6px;
  background: var(--surface2);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 6px;
}
.fill-bar-lg .progress-fill { background: var(--blue); }
.cat-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  margin-top: 6px;
  color: var(--text2);
}

.full-width { grid-column: 1 / -1; }

.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}
th {
  text-align: left;
  padding: 8px 10px;
  font-weight: 600;
  color: var(--text2);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 10px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover { background: var(--surface2); }

@media (max-width: 640px) {
  .table-wrap { overflow: visible; }
  table, thead, tbody, tr { display: block; }
  thead { display: none; }
  tbody tr {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2px 12px;
    margin-bottom: 10px;
  }
  tbody tr:last-child { margin-bottom: 0; }
  tbody tr:hover { background: var(--surface); }
  td {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    text-align: right;
  }
  td:last-child { border-bottom: none; }
  td::before {
    content: attr(data-label);
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text2);
    flex-shrink: 0;
    text-align: left;
  }
}

@media (max-width: 480px) {
  .chapelle-label { min-width: 68px; font-size: 0.75rem; }
  .chapelle-count { min-width: 32px; font-size: 0.75rem; }
  .refresh-btn { padding: 6px 12px; }
}

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 600;
  white-space: nowrap;
}
.badge-new { background: var(--blue-bg); color: var(--blue); }
.badge-en-cours { background: var(--orange-bg); color: var(--orange); }
.badge-visite { background: var(--purple); color: #fff; }
.badge-signe { background: var(--green-bg); color: var(--green); }
.badge-actif { background: var(--green-bg); color: var(--green); }
.badge-termine { background: var(--surface2); color: var(--text2); }

.days-badge {
  font-weight: 600;
  font-size: 0.8rem;
}
.days-warn { color: var(--orange); }
.days-danger { color: var(--red); }

.assurance-yes { color: var(--green); }
.assurance-no { color: var(--red); font-weight: 600; }

.conv-list { list-style: none; }
.conv-item { border-bottom: 1px solid var(--border); }
.conv-item:last-child { border-bottom: none; }
.conv-item summary {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  cursor: pointer;
  list-style: none;
}
.conv-item summary::-webkit-details-marker { display: none; }
.conv-name { font-weight: 600; flex: 1; }
.conv-sujet { font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; }
.conv-msg { font-size: 0.85rem; color: var(--text2); margin-bottom: 4px; }
.conv-meta { font-size: 0.75rem; color: var(--text2); display: flex; gap: 10px; }
.conv-detail { padding: 0 0 12px 24px; }
.conv-chevron { color: var(--text2); font-size: 0.7rem; transition: transform 0.2s; }
details[open] .conv-chevron { transform: rotate(90deg); }
.echange-item {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.echange-item:last-child { border-bottom: none; }
.upcoming-meta { font-size: 0.75rem; color: var(--text2); }

.loading { text-align: center; padding: 40px; color: var(--text2); }
.error-msg { text-align: center; padding: 20px; color: var(--red); font-size: 0.9rem; }
.mock-banner {
  background: var(--orange-bg);
  color: var(--orange);
  text-align: center;
  padding: 8px;
  font-size: 0.8rem;
  font-weight: 600;
  border-radius: 8px;
  margin-bottom: 16px;
}
</style>
</head>
<body>

<div class="header">
  <h1>Mon Hangar</h1>
  <div class="header-right">
    <span class="last-update" id="lastUpdate"></span>
    <button class="refresh-btn" onclick="loadData()">Actualiser</button>
  </div>
</div>

<div class="mock-banner" id="mockBanner" style="display:none">Données de démonstration — en attente de connexion NocoDB</div>

<div class="grid">
  <div class="card" id="fillCard">
    <div class="card-title">Remplissage</div>
    <div id="fillContent"><div class="loading">Chargement…</div></div>
  </div>

  <div class="card" id="revenueCard">
    <div class="card-title">Revenus</div>
    <div id="revenueContent"><div class="loading">Chargement…</div></div>
  </div>

  <div class="card full-width" id="convCard">
    <div class="card-title">Échanges en cours</div>
    <ul class="conv-list" id="convList"></ul>
  </div>

  <div class="card full-width" id="contratsCard">
    <div class="card-title">Contrats</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Client</th>
            <th>Téléphone</th>
            <th>Véhicule</th>
            <th>Statut</th>
            <th>Début</th>
            <th>Fin</th>
            <th>Loyer</th>
            <th>Dépôt</th>
          </tr>
        </thead>
        <tbody id="contratsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://automate.libraudit.tech/webhook/cc-dashboard';
const USE_MOCK = false;

const MOCK = {
  emplacements: Array.from({length:32}, (_,i) => {
    const n = i + 1;
    const chapelle = Math.ceil(n / 8);
    if (n <= 3) return {id:n, numero:n, chapelle, statut:'Occupé', client_nom:'Leroy', categorie:'Court'};
    if (n === 4) return {id:n, numero:n, chapelle, statut:'Réservé', client_nom:'Jansen', categorie:'Moyen'};
    if (n <= 8) return {id:n, numero:n, chapelle, statut:'Libre', client_nom:null, categorie:null};
    if (n === 9) return {id:n, numero:n, chapelle, statut:'Occupé', client_nom:'Dupont', categorie:'Moyen'};
    if (n === 10) return {id:n, numero:n, chapelle, statut:'Réservé', client_nom:'Martin', categorie:'Moyen'};
    return {id:n, numero:n, chapelle, statut:'Libre', client_nom:null, categorie:null};
  }),
  contacts: [
    { nom:'Dupont Jean', telephone:'06 00 00 00 01', statutAvance:'Visite planifiée', echanges:[{sujet:'Visite prévue', message:'RDV samedi', canal:'Telephone', date:'2026-09-01'}] },
    { nom:'Jansen Marc', telephone:'06 00 00 00 02', statutAvance:'Signé', echanges:[{sujet:'Signature', message:'Contrat signé', canal:'Visite', date:'2026-08-28'},{sujet:'Assurance', message:'Reçue', canal:'Email', date:'2026-08-30'}] },
    { nom:'Martin Lucie', telephone:'06 00 00 00 03', statutAvance:'Nouveau', echanges:[{sujet:'Demande', message:'Intéressée', canal:'Email', date:'2026-08-31'}] },
  ],
  contrats: [],
  revenus: {
    ca_actif: 226,
    ca_projete: 2016,
    taux_remplissage: 0.125,
    categories: [
      {nom:'Court', count:1, prix:33, total:33},
      {nom:'Moyen', count:2, prix:43, total:86},
      {nom:'Long', count:0, prix:60, total:0},
    ]
  }
};

function fullName(clientObj) {
  if (!clientObj) return '?';
  const p = clientObj.Prenom || '';
  const n = clientObj.Nom || '';
  if (p && n) return `${p} ${n}`;
  return n || p || '?';
}

function adaptData(raw) {
  if (!raw.chapelles) return raw;
  const chapelles = raw.chapelles;
  const byClient = {};
  (raw.conversations || []).forEach(c => {
    const clientObj = (c.Clients || [])[0] || {};
    const key = clientObj.Id ? 'c' + clientObj.Id : 'anon_' + (c.Sujet || Math.random());
    if (!byClient[key]) {
      byClient[key] = {
        clientId: clientObj.Id || null,
        nom: fullName(clientObj),
        telephone: clientObj.Telephone || '',
        vehicule: clientObj['Marque / Modele'] || '',
        echanges: []
      };
    }
    byClient[key].echanges.push({
      sujet: c.Sujet || 'Sans objet',
      message: c.Message || '',
      canal: c.Canal || '',
      date: c['Date reception'] ? String(c['Date reception']).slice(0,10) : '',
      statut: c.Statut || 'Nouveau'
    });
  });
  const contacts = Object.values(byClient);
  const rank = { 'Ferme':0, 'Nouveau':1, 'Relance':2, 'En cours':3, 'Traite':4 };
  contacts.forEach(c => {
    c.statutAvance = c.echanges.reduce((m, e) => (rank[e.statut] ?? 0) > (rank[m] ?? 0) ? e.statut : m, 'Ferme');
    c.echanges.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  });
  contacts.sort((a, b) => (a.nom || '').localeCompare(b.nom || '', 'fr'));
  return { chapelles, emplacements: raw.emplacements, contacts, contrats: raw.contrats, revenus: raw.revenus };
}

function renderFill(data) {
  const chapelles = data.chapelles || [];
  const totalAll = chapelles.reduce((s, c) => s + (c.total || 0), 0) || 32;
  const totalPris = chapelles.reduce((s, c) => s + (c.pris || 0), 0);
  const totalPct = totalAll > 0 ? Math.round(totalPris / totalAll * 100) : 0;

  let html = '';
  chapelles.forEach(ch => {
    html += `<div class="chapelle-row">
      <span class="chapelle-label">Chapelle ${ch.c}</span>
      <div class="progress-bar"><div class="progress-fill green" style="width:${ch.pct || 0}%"></div></div>
      <span class="chapelle-count">${ch.pris}/${ch.total}</span>
    </div>`;
    (ch.demi || []).forEach(d => {
      const klass = d.pct > 60 ? 'green' : d.pct > 30 ? 'orange' : 'green';
      html += `<div class="demi-row">
        <span class="demi-label">${d.label}</span>
        <div class="progress-bar"><div class="progress-fill ${klass}" style="width:${d.pct || 0}%"></div></div>
        <span class="demi-count">${d.pris}/${d.total}</span>
      </div>`;
    });
  });
  html += `<div class="total-row chapelle-row">
    <span class="chapelle-label">Total</span>
    <div class="progress-bar"><div class="progress-fill green" style="width:${totalPct}%"></div></div>
    <span class="chapelle-count">${totalPris}/${totalAll}</span>
  </div>`;
  document.getElementById('fillContent').innerHTML = html;
}

function renderRevenue(data) {
  const r = data.revenus;
  let catsHtml = r.categories.map(c =>
    `<div class="cat-row"><span>${c.nom}: ${c.count} × ${c.prix}€</span><span>${c.total}€</span></div>`
  ).join('');

  document.getElementById('revenueContent').innerHTML = `
    <div class="revenue-main">${r.ca_actif} €<span style="font-size:1rem;font-weight:400;color:var(--text2)">/mois</span></div>
    <div class="revenue-sub">Projeté (plein) : ${r.ca_projete} €/mois</div>
    <div class="fill-indicator">
      <div style="display:flex;justify-content:space-between;font-size:0.8rem">
        <span>Taux remplissage</span><span style="font-weight:600">${(r.taux_remplissage*100).toFixed(0)}%</span>
      </div>
      <div class="fill-bar-lg"><div class="progress-fill" style="width:${r.taux_remplissage*100}%"></div></div>
    </div>
    ${catsHtml}
  `;
}

function renderConversations(data) {
  const list = document.getElementById('convList');
  const contacts = data.contacts || [];
  if (!contacts.length) {
    list.innerHTML = '<li><div class="upcoming-meta" style="padding:10px 0">Aucun échange en cours</div></li>';
    return;
  }
  list.innerHTML = contacts.map(c => {
    const s = c.statutAvance || 'Nouveau';
    const statutClass = {
      'Ferme':'badge-termine','Nouveau':'badge-new','Relance':'badge-en-cours','En cours':'badge-en-cours','Traite':'badge-actif',
      'Visite planifiee':'badge-visite','Visite planifiée':'badge-visite','Signe':'badge-signe','Signé':'badge-signe','Actif':'badge-actif'
    }[s] || 'badge-new';
    const echangesHtml = c.echanges.map(e => `
      <div class="echange-item">
        <div class="conv-sujet">${e.sujet || 'Sans objet'}</div>
        <div class="conv-msg">${e.message || '—'}</div>
        <div class="conv-meta"><span>${e.canal || '—'}</span><span>${e.date || ''}</span></div>
      </div>
    `).join('');
    return `<li class="conv-item">
      <details>
        <summary>
          <span class="conv-chevron">▶</span>
          <span class="conv-name">${c.nom || '?'}</span>
          ${c.telephone ? `<span class="upcoming-meta">${c.telephone}</span>` : ''}
          ${c.echanges.length > 1 ? `<span class="upcoming-meta">(${c.echanges.length})</span>` : ''}
          <span class="badge ${statutClass}">${s}</span>
        </summary>
        <div class="conv-detail">${echangesHtml}</div>
      </details>
    </li>`;
  }).join('');
}

function renderContrats(data) {
  const tbody = document.getElementById('contratsBody');
  const list = (data.contrats || []).slice().sort((a,b) => (a['Date debut']||'').localeCompare(b['Date debut']||''));
  tbody.innerHTML = list.map(c => {
    const clientObj = (c.Clients || [])[0] || {};
    const statut = c.Statut || '—';
    const statutClass = { 'Actif':'badge-actif', 'En attente':'badge-en-cours', 'Resilie':'badge-termine', 'Expire':'badge-termine' }[statut] || 'badge-new';
    const depot = c['Date depot'] ? String(c['Date depot']).slice(0,10) : '—';
    return `<tr>
      <td data-label="Client" style="font-weight:600">${fullName(clientObj)}</td>
      <td data-label="Téléphone">${clientObj.Telephone || '—'}</td>
      <td data-label="Véhicule">${clientObj['Marque / Modele'] || '—'} <span style="color:var(--text2)">(${clientObj['Longueur vehicule'] || '—'})</span></td>
      <td data-label="Statut"><span class="badge ${statutClass}">${statut}</span></td>
      <td data-label="Début">${c['Date debut'] || '—'}</td>
      <td data-label="Fin">${c['Date fin'] || '—'}</td>
      <td data-label="Loyer">${c['Tarif mensuel'] != null ? c['Tarif mensuel'] + ' €/mois' : '—'}</td>
      <td data-label="Dépôt">${depot}</td>
    </tr>`;
  }).join('');
}

async function loadData() {
  document.getElementById('lastUpdate').textContent = '';
  let data;
  if (USE_MOCK || !API_URL) {
    data = MOCK;
    document.getElementById('mockBanner').style.display = 'block';
  } else {
    try {
      const resp = await fetch(API_URL);
      if (!resp.ok) throw new Error(resp.statusText);
      const raw = await resp.json();
      data = adaptData(raw);
      document.getElementById('mockBanner').style.display = 'none';
    } catch(e) {
      document.getElementById('mockBanner').textContent = 'Erreur de connexion — données mock affichées';
      document.getElementById('mockBanner').style.display = 'block';
      data = MOCK;
    }
  }
  renderFill(data);
  renderRevenue(data);
  renderConversations(data);
  renderContrats(data);
  const now = new Date();
  document.getElementById('lastUpdate').textContent = `MAJ ${now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`;
}

loadData();
</script>
</body>
</html>
